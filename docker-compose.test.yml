# Integration-test databases. Started by scripts/test-backends.sh.
# 集成测试数据库，由 scripts/test-backends.sh 启动。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sakuio
      POSTGRES_PASSWORD: sakuio
      POSTGRES_DB: sakuio_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakuio -d sakuio_test"]
      interval: 2s
      timeout: 3s
      retries: 40

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sakuio
      MYSQL_DATABASE: sakuio_test
      MYSQL_USER: sakuio
      MYSQL_PASSWORD: sakuio
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -usakuio -psakuio --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: sakuio
      MARIADB_DATABASE: sakuio_test
      MARIADB_USER: sakuio
      MARIADB_PASSWORD: sakuio
    ports:
      - "53307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -usakuio -psakuio --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
