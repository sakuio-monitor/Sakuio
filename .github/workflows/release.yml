name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (admin + theme)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sakuio-monitor/Sakuio-frontend
          path: frontend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install
      - name: Build admin SPA
        working-directory: frontend/apps/admin
        run: bunx vite build
      - name: Build public theme package
        working-directory: frontend/apps/public
        run: bunx vite build
      - name: Name theme release asset
        shell: bash
        run: |
          THEME_ZIP="$(ls frontend/apps/public/sakuio-theme-build-*.zip | head -1)"
          cp "$THEME_ZIP" frontend.zip
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle
          path: |
            frontend/apps/admin/dist
            frontend.zip
          if-no-files-found: error

  build:
    name: ${{ matrix.asset }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl, same target family as Sakuio-agent.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: sakuio-server-linux-amd64, zig: true }
          - { os: ubuntu-24.04, target: i686-unknown-linux-musl, asset: sakuio-server-linux-386, zig: true }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl, asset: sakuio-server-linux-arm64, zig: true }
          - { os: ubuntu-24.04, target: armv7-unknown-linux-musleabihf, asset: sakuio-server-linux-arm, zig: true }
          - { os: ubuntu-24.04, target: loongarch64-unknown-linux-musl, asset: sakuio-server-linux-loong64, zig: true }
          - { os: ubuntu-24.04, target: riscv64gc-unknown-linux-musl, asset: sakuio-server-linux-riscv64, zig: true }
          # Windows native.
          - { os: windows-2022, target: x86_64-pc-windows-msvc, asset: sakuio-server-windows-amd64.exe, zig: false }
          - { os: windows-2022, target: i686-pc-windows-msvc, asset: sakuio-server-windows-386.exe, zig: false }
          - { os: windows-2022, target: aarch64-pc-windows-msvc, asset: sakuio-server-windows-arm64.exe, zig: false }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-bundle
          path: frontend-bundle

      - name: Prepare embedded admin
        shell: bash
        run: cp -R frontend-bundle/frontend/apps/admin/dist crates/sakuio-server/admin-dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig
        if: matrix.zig
        shell: bash
        run: |
          curl -fsSL --retry 3 -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build (static musl)
        if: matrix.zig
        shell: bash
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          SAKUIO_BUILD_COMMIT: ${{ github.sha }}
        run: cargo zigbuild --release --target ${{ matrix.target }} --features embedded-admin -p sakuio-server

      - name: Verify static binary
        if: matrix.zig
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/sakuio-server"
          file "$BIN"
          if file "$BIN" | grep -qi "dynamically linked"; then
            echo "::error::expected static musl binary"
            exit 1
          fi

      - name: Build (native)
        if: ${{ !matrix.zig }}
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --features embedded-admin -p sakuio-server

      - name: Collect asset
        shell: bash
        run: |
          EXE=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXE=".exe"; fi
          cp "target/${{ matrix.target }}/release/sakuio-server$EXE" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [frontend, build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
